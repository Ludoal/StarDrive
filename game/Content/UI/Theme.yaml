Theme:
  # ─────────────────────────────────────────────────────────────────────────────
  # The game's UI style, in one place. Colours are [R,G,B] or [R,G,B,A], 0-255.
  # Edit, relaunch the game, see the result - no rebuild.
  #
  # Fonts are named by ROLE, not by typeface: change WindowTitle here and every
  # window title follows, wherever it is drawn. Valid names are the ones the game
  # loads - Arial8Bold, Arial10, Arial11Bold, Arial12, Arial12Bold, Arial14Bold,
  # Arial20Bold, Tahoma10, Tahoma11, TahomaBold9, Verdana10, Verdana12,
  # Verdana12Bold, Consolas18, Laserian14, Pirulen12, Pirulen16, Pirulen20.
  # ─────────────────────────────────────────────────────────────────────────────

  # ── Windows and frames ───────────────────────────────────────────────────────
  # Read off the Codex, which is the look the rest follows.
  FrameRule:      [193, 113, 26]      # the line around every window and panel
  FrameBody:      [14, 14, 14, 240]   # what fills a window
  FrameTitleBar:  [54, 54, 54, 240]   # one step lighter, so a title bar reads as one
  TitleBarHeight: 46
  # The Textures folder the popup frame's bitmaps come from. Point it at a folder of
  # same-named, SAME-SIZED textures and every popup window follows; any piece the folder
  # lacks falls back to the classic Popup set, so a partial skin still draws whole.
  # LudoalTheme starts as a byte-for-byte copy of the classic sets - retouch its PNGs
  # (same names, same sizes) and relaunch to see the result.
  PopupSkin: LudoalTheme
  # Same lever for the tab groups' chrome (frame, headers): the folder holding the
  # submenu_* pieces. Falls back piece by piece to the classic NewUI set. Only the default
  # Brown style follows this; the Blue research style keeps its own look.
  SubmenuSkin: LudoalTheme

  # ── Tab panels: the two paddings ─────────────────────────────────────────────
  # Outer: how far a panel's content area sits inside the panel's own edges.
  # ⚠ 9 is a floor, not a default - the corner is a 9x9 drawing, and below that the
  # content runs underneath it. Raise it freely; lowering it does nothing.
  TabPadOuter: 10
  # Inner: the layout STEP inside a panel - the air between a panel and what sits under it,
  # and the gap a foot notch reckons with (a notch is one button plus one of these).
  # ⚠ Not the text's inset: each kind of element carries its own default (TextPad below).
  TabPadInner: 10
  # Every painted button's height. 25 is the plate asset's own height, so it is the value
  # the buttons were always closest to - and it reckons in fives with the paddings.
  ButtonHeight: 25
  # The lane a scroll list keeps on its right for the scrollbar. The drawing is two widths -
  # the bar is 11, the arrows 13 - so 25 leaves 12 clear to their left, and the bar closes on
  # the list's own edge: the tab's padding is the margin, not a second gap here.
  ScrollbarLane: 25
  # What a scroll list keeps on its LEFT, inside its own rect - the row's selection frame is
  # drawn in it. It belongs to the LIST, not to the panel: a list sits on the frame's edge and
  # adds this, rather than taking the panel's inner padding and stacking two margins.
  ListPadLeft: 5
  # What TEXT keeps inside a panel's client area. Every kind of element carries its own
  # default and an instance may overrule it; text's is 0, the frame's own clearance being
  # margin enough. Raise it and every panel's prose steps in together.
  TextPad: 0

  # ── Buttons ──────────────────────────────────────────────────────────────────
  # One tint per MEANING. Hover and Pressed are derived from the tint rather than
  # being colours of their own: a hovered button is a lighter version of itself,
  # never a different colour. HoverLift/PressDrop are 0.0-1.0.
  PlateNeutral:  [193, 113, 26]   # nothing in particular
  PlateActive:   [108, 152, 214]  # an active control, or an order that starts something
  PlateHostile:  [206, 92, 84]    # a hostile action, or one that cancels an order
  PlateMuted:    [122, 116, 104]  # out of reach for now
  PlateOpacity:  0.92
  CornerRadius:  8      # how round the corners are - drawn, not an asset, so any value works
  FaceTop:       0.62   # the plate's face at its top edge, as an alpha over what is behind
  FaceBottom:    0.46   # and at its foot - the difference IS the relief
  RuleStrength:  0.55   # the line around it; 1.0 is the full tint and reads as neon
  RuleWidth:     2      # how thick that line runs, in pixels
  HoverLift:     0.22   # how far the tint moves toward white under the cursor
  PressDrop:     0.28   # and toward black while held

  # ── Controls ─────────────────────────────────────────────────────────────────
  # The small input furniture: slider tracks, checkbox boxes, dropdown panels.
  ControlOutline:      [96, 81, 49]      # the box or track line at rest
  ControlOutlineHover: [164, 154, 133]   # the same line under the cursor
  ControlFill:         [22, 22, 23]      # what fills an open panel, e.g. a dropdown's list
  ControlHoverFill:    [128, 87, 43, 50] # the wash over a hovered row

  # ── Text ─────────────────────────────────────────────────────────────────────
  TextPrimary: [255, 240, 189]   # the default ink
  TextDim:     [190, 180, 150]   # secondary lines, captions
  TextGood:    [144, 238, 144]   # a number in your favour
  TextBad:     [255, 96, 96]     # a number against you
  TextLocked:  [105, 105, 105]   # what you have not earned the right to see

  # ── Tables ───────────────────────────────────────────────────────────────────
  # The list screens: Planets, Ships, Troops, Patrols, Events, Exotic Systems.
  TableHeader:      [255, 240, 189]   # the column titles
  TableHeaderFont:  Arial14Bold
  TableText:        [255, 240, 189]   # an ordinary cell
  TableTextFont:    Arial12
  TableTitle:       [255, 240, 189]   # the row's own name - planet, ship, fleet
  TableTitleFont:   Arial20Bold       # deliberately larger: it is what you scan for
  TableSubtitle:    [190, 180, 150]   # the line under it (class, role, status)
  TableSubtitleFont: Arial12
  TableRowHover:    [255, 255, 255, 30]   # the band under the cursor
  TableRowSelected: [193, 113, 26, 45]    # and under the row you picked
  TableGridLine:    [118, 102, 67, 128]   # the rules between columns and rows

  # ── Fonts by role ────────────────────────────────────────────────────────────
  WindowTitle:  Arial20Bold   # the name of a window, in its title bar
  SectionTitle: Arial12Bold   # a band inside one - BUDGET, TREATIES, POPULATION
  Body:         Arial12       # ordinary prose and labels
  Value:        Arial12Bold   # a number the eye goes to
  Small:        Arial10       # footnotes, counts, anything secondary
